plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
    id "androidx.navigation.safeargs.kotlin"
}

android {
    namespace 'com.kazumaproject.markdownhelperkeyboard'
    compileSdk 36

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
    }

    signingConfigs {
        release {
            def keystoreFile = localProperties['KEYSTORE_FILE'] ?: System.getenv('HIMAWARI_KEYSTORE_FILE')
            def keystorePassword = localProperties['KEYSTORE_PASSWORD'] ?: System.getenv('HIMAWARI_KEYSTORE_PASSWORD')
            def keyAliasValue = localProperties['KEY_ALIAS'] ?: System.getenv('HIMAWARI_KEY_ALIAS')
            def keyPasswordValue = localProperties['KEY_PASSWORD'] ?: System.getenv('HIMAWARI_KEY_PASSWORD')
            if (keystoreFile) {
                def keystorePath = new File(keystoreFile)
                storeFile keystorePath.isAbsolute() ? keystorePath : rootProject.file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    defaultConfig {
        applicationId "com.shibadogcap.himawarikeyboard"
        minSdk 24
        targetSdk 36
        versionCode 764
        versionName "1.7.71"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    flavorDimensions "edition", "channel"

    productFlavors {
        full {
            dimension "edition"
            buildConfigField "boolean", "HAS_ZENZ", "true"
            buildConfigField "boolean", "HAS_GEMMA", "true"
            buildConfigField "String", "APP_EDITION", "\"full\""
        }
        lite {
            dimension "edition"
            applicationIdSuffix ".lite"
            versionNameSuffix "-lite"
            buildConfigField "boolean", "HAS_ZENZ", "false"
            buildConfigField "boolean", "HAS_GEMMA", "false"
            buildConfigField "String", "APP_EDITION", "\"lite\""
        }
        standard {
            dimension "channel"
            buildConfigField "boolean", "IS_FDROID", "false"
            buildConfigField "String", "DIST_CHANNEL", "\"standard\""
        }
        fdroid {
            dimension "channel"
            applicationIdSuffix ".fdroid"
            versionNameSuffix "-fdroid"
            buildConfigField "boolean", "IS_FDROID", "true"
            buildConfigField "String", "DIST_CHANNEL", "\"fdroid\""
        }
    }

    variantFilter { variant ->
        def flavorNames = variant.flavors*.name
        if (flavorNames.contains("full") && flavorNames.contains("fdroid")) {
            setIgnore(true)
        }
    }

    def shouldSplitApks = project.hasProperty('splitApks')

    if (shouldSplitApks) {
        splits {
            abi {
                enable true
                reset()
                include 'arm64-v8a', 'x86_64'
                universalApk false
            }
        }
    }

    buildTypes {
        release {
            def releaseSigning = signingConfigs.findByName("release")
            if (releaseSigning?.storeFile) {
                signingConfig releaseSigning
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseUnsigned {
            initWith release
            signingConfig null
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    viewBinding {
        enabled = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // QwertyGlideDecoderPerformanceTest is excluded here (CI/default suite).
        // Run it via: ./gradlew :app:testFullStandardDebugUnitTestPerformance
        unitTests.all {
            filter {
                excludeTestsMatching "*QwertyGlideDecoderPerformanceTest*"
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def flavorPrefix = variant.flavorName ? "${variant.flavorName}-" : ""
            // 分割モードが有効な場合のみ実行
            if (shouldSplitApks) {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                if (abi != null) {
                    if (abi == "arm64-v8a") {
                        output.versionCodeOverride = variant.versionCode + 1
                    } else if (abi == "x86_64") {
                        output.versionCodeOverride = variant.versionCode + 2
                    }
                    output.outputFileName = "app-${flavorPrefix}${abi}-${variant.buildType.name}.apk"
                }
            } else if (variant.flavorName == "liteFdroid" && variant.buildType.name == "release") {
                output.outputFileName = "app-${flavorPrefix}${variant.buildType.name}.apk"
            }

            // Override name specifically for releaseUnsigned
            if (variant.buildType.name == "releaseUnsigned") {
                output.outputFileName = "app-${flavorPrefix}release-unsigned.apk"
            }
        }
    }

}

def azooKeyLoudsDirectory = {
    def configuredPath = project.findProperty("azooKeyLoudsDir") ?: project.findProperty("azooKeyLoudsDestDir")
    return configuredPath ? file(configuredPath) : file("$projectDir/src/main/assets/louds")
}

tasks.register("generateAzooKeyLoudsManifest") {
    group = "azookey"
    description = "Generate app/src/main/assets/louds/identifiers.txt from complete .louds/.loudschars2 pairs."

    doLast {
        def loudsDir = azooKeyLoudsDirectory()
        if (!loudsDir.exists()) {
            throw new GradleException("AzooKey LOUDS directory does not exist: ${loudsDir}")
        }

        def rawIdentifiers = ["user", "memory", "user_shortcuts"] as Set
        def decodeIdentifier = { String stem ->
            if (rawIdentifiers.contains(stem)) {
                return stem
            }
            if (!stem.startsWith("[") || !stem.endsWith("]")) {
                return stem
            }
            def body = stem.substring(1, stem.length() - 1)
            if (body.isEmpty()) {
                return ""
            }
            def builder = new StringBuilder()
            for (String chunk : body.split("_")) {
                builder.append((char) Integer.parseInt(chunk, 16))
            }
            return builder.toString()
        }

        def loudsIdentifiers = [] as Set
        def loudsChars2Identifiers = [] as Set
        loudsDir.listFiles()?.each { File file ->
            def name = file.name
            if (name.endsWith(".louds")) {
                loudsIdentifiers.add(decodeIdentifier(name.substring(0, name.length() - ".louds".length())))
            } else if (name.endsWith(".loudschars2")) {
                loudsChars2Identifiers.add(decodeIdentifier(name.substring(0, name.length() - ".loudschars2".length())))
            }
        }

        def identifiers = loudsIdentifiers.intersect(loudsChars2Identifiers).findAll { it }.sort()
        def manifestFile = new File(loudsDir, "identifiers.txt")
        manifestFile.text = identifiers ? identifiers.join("\n") + "\n" : ""
        logger.lifecycle("Generated ${manifestFile} with ${identifiers.size()} AzooKey LOUDS identifiers.")
    }
}

tasks.register("verifyAzooKeyLoudsAssets") {
    group = "azookey"
    description = "Verify AzooKey LOUDS assets have charID.chid, .louds, .loudschars2, and at least one .loudstxt3 shard."

    doLast {
        def loudsDir = azooKeyLoudsDirectory()
        if (!loudsDir.exists()) {
            throw new GradleException("AzooKey LOUDS directory does not exist: ${loudsDir}")
        }

        def rawIdentifiers = ["user", "memory", "user_shortcuts"] as Set
        def decodeIdentifier = { String stem ->
            if (rawIdentifiers.contains(stem)) {
                return stem
            }
            if (!stem.startsWith("[") || !stem.endsWith("]")) {
                return stem
            }
            def body = stem.substring(1, stem.length() - 1)
            if (body.isEmpty()) {
                return ""
            }
            def builder = new StringBuilder()
            for (String chunk : body.split("_")) {
                builder.append((char) Integer.parseInt(chunk, 16))
            }
            return builder.toString()
        }
        def shardIdentifier = { String name ->
            def stem = name.substring(0, name.length() - ".loudstxt3".length())
            def identifierStem = stem.replaceFirst("\\d+\$", "")
            if (identifierStem == stem) {
                return null
            }
            return decodeIdentifier(identifierStem)
        }

        def fileNames = loudsDir.listFiles()?.collect { it.name } ?: []
        def loudsIdentifiers = [] as Set
        def loudsChars2Identifiers = [] as Set
        def shardIdentifiers = [] as Set
        fileNames.each { String name ->
            if (name.endsWith(".louds")) {
                loudsIdentifiers.add(decodeIdentifier(name.substring(0, name.length() - ".louds".length())))
            } else if (name.endsWith(".loudschars2")) {
                loudsChars2Identifiers.add(decodeIdentifier(name.substring(0, name.length() - ".loudschars2".length())))
            } else if (name.endsWith(".loudstxt3")) {
                def identifier = shardIdentifier(name)
                if (identifier != null) {
                    shardIdentifiers.add(identifier)
                }
            }
        }

        def knownIdentifiers = (loudsIdentifiers + loudsChars2Identifiers + shardIdentifiers) as Set
        def missing = []
        if (!fileNames.contains("charID.chid")) {
            missing.add("charID.chid")
        }
        def missingLouds = (knownIdentifiers - loudsIdentifiers).sort()
        def missingLoudsChars2 = (knownIdentifiers - loudsChars2Identifiers).sort()
        def missingShard = (knownIdentifiers - shardIdentifiers).sort()
        if (missingLouds) {
            missing.add("missing .louds for: ${missingLouds.join(', ')}")
        }
        if (missingLoudsChars2) {
            missing.add("missing .loudschars2 for: ${missingLoudsChars2.join(', ')}")
        }
        if (missingShard) {
            missing.add("missing .loudstxt3 shard for: ${missingShard.join(', ')}")
        }
        if (missing) {
            throw new GradleException("Invalid AzooKey LOUDS assets in ${loudsDir}: ${missing.join('; ')}")
        }

        def completeIdentifiers = loudsIdentifiers.intersect(loudsChars2Identifiers).intersect(shardIdentifiers).sort()
        logger.lifecycle("Verified ${completeIdentifiers.size()} AzooKey LOUDS identifiers in ${loudsDir}.")
    }
}

tasks.register("copyAzooKeyLoudsAssets", Copy) {
    group = "azookey"
    description = "Copy AzooKey LOUDS assets from -PazooKeyLoudsSourceDir to app/src/main/assets/louds or -PazooKeyLoudsDestDir."

    def sourceDirProvider = providers.gradleProperty("azooKeyLoudsSourceDir")
    def destDirProvider = providers.gradleProperty("azooKeyLoudsDestDir")
            .orElse("$projectDir/src/main/assets/louds")

    onlyIf {
        if (!sourceDirProvider.present) {
            throw new GradleException("Missing -PazooKeyLoudsSourceDir=/path/to/louds")
        }
        true
    }

    from(sourceDirProvider.map { file(it) }) {
        include "charID.chid"
        include "*.louds"
        include "*.loudschars2"
        include "*.loudstxt3"
    }
    into(destDirProvider.map { file(it) })
}

tasks.register("prepareAzooKeyLoudsAssets") {
    group = "azookey"
    description = "Copy, verify, and generate identifiers.txt for AzooKey LOUDS assets."
    dependsOn("copyAzooKeyLoudsAssets", "verifyAzooKeyLoudsAssets", "generateAzooKeyLoudsManifest")
}

tasks.named("verifyAzooKeyLoudsAssets") {
    mustRunAfter("copyAzooKeyLoudsAssets")
}

tasks.named("generateAzooKeyLoudsManifest") {
    mustRunAfter("verifyAzooKeyLoudsAssets")
}

tasks.register("copyAzooKeyConnectionAssets", Copy) {
    group = "azookey"
    description = "Copy AzooKey cb/*.binary and mm.binary from -PazooKeyDictionarySourceDir to app/src/main/assets/azookey."

    def sourceDirProvider = providers.gradleProperty("azooKeyDictionarySourceDir")
    def destDirProvider = providers.gradleProperty("azooKeyDictionaryDestDir")
            .orElse("$projectDir/src/main/assets/azookey")

    onlyIf {
        if (!sourceDirProvider.present) {
            throw new GradleException(
                    "Missing -PazooKeyDictionarySourceDir=/path/to/AzooKey Dictionary root (contains cb/, mm.binary)"
            )
        }
        true
    }

    from(sourceDirProvider.map { file(it) }) {
        include "mm.binary"
        include "cb/**"
    }
    into(destDirProvider.map { file(it) })
}

tasks.register("prepareAzooKeyDictionaryAssets") {
    group = "azookey"
    description = "Copy LOUDS + connection-cost assets and generate louds manifest."
    dependsOn(
            "copyAzooKeyLoudsAssets",
            "copyAzooKeyConnectionAssets",
            "verifyAzooKeyLoudsAssets",
            "generateAzooKeyLoudsManifest",
    )
}

tasks.register("copyAzooKeyEmojiDictionaryAssets", Copy) {
    group = "azookey"
    description = "Copy AzooKey emoji_all and optional emoji_dict dictionary text to app/src/main/assets/azookey/emoji."

    def sourceFileProvider = providers.gradleProperty("azooKeyEmojiDictionarySourceFile")
    def dicdataSourceFileProvider = providers.gradleProperty("azooKeyEmojiDicdataDictionarySourceFile")
    def destDirProvider = providers.gradleProperty("azooKeyEmojiDictionaryDestDir")
            .orElse("$projectDir/src/main/assets/azookey/emoji")

    onlyIf {
        if (!sourceFileProvider.present) {
            throw new GradleException("Missing -PazooKeyEmojiDictionarySourceFile=/path/to/emoji_all_E17.0.txt")
        }
        true
    }

    from(sourceFileProvider.map { file(it) }) {
        rename { "emoji_all_E17.0.txt" }
    }
    if (dicdataSourceFileProvider.present) {
        from(dicdataSourceFileProvider.map { file(it) }) {
            rename { "emoji_dict_E17.0.txt" }
        }
    }
    into(destDirProvider.map { file(it) })
}

