// Performance-only unit tests (not part of testFullStandardDebugUnitTest).
afterEvaluate {
    def standardUnitTest = tasks.named("testFullStandardDebugUnitTest")
    tasks.register("testFullStandardDebugUnitTestPerformance", Test) {
        group = "verification"
        description = "Runs QwertyGlideDecoderPerformanceTest only (excluded from testFullStandardDebugUnitTest)."
        testClassesDirs = standardUnitTest.get().testClassesDirs
        classpath = standardUnitTest.get().classpath
        filter {
            includeTestsMatching "*QwertyGlideDecoderPerformanceTest*"
        }
    }
}
